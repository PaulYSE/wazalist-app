<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="icons/app-icon-purple.svg" />
    <link rel="apple-touch-icon" href="icons/app-icon-purple.png" />

    <title>Wazalist Admin</title>
    <link rel="stylesheet" href="css/admin.css" />
  </head>

  <body>
    <div class="topbar">
      <h1>⛩ Wazalist</h1>
      <span class="badge">Admin</span>
      <span id="pendingCount"></span>
    </div>

    <div class="body">
      <!-- Queue sidebar -->
      <div class="sidebar">
        <div class="sidebar-tabs">
          <button class="stab active" data-status="pending">Pending</button>
          <button class="stab" data-status="approved">Approved</button>
          <button class="stab" data-status="rejected">Rejected</button>
        </div>
        <div id="queueList"></div>
      </div>

      <!-- Detail panel -->
      <div class="detail" id="detailPanel">
        <div class="d-empty">Select a contribution to review</div>
      </div>
    </div>

    <script type="module" src="js/admin/admin.js"></script>
  </body>
</html>
